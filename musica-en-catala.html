<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Música en català</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&family=Noto+Music&display=swap" rel="stylesheet">
<style>
/* Plan: rotulat de taller de música amb colors de Costa d'Ivori (taronja, verd) i sol groc.
   Targetes blanques amb contorn gruixut i ombra dura; peça de color per categoria. */
:root{
  --ink:#2a1d14; --paper:#FFF6D8; --card:#ffffff;
  --orange:#F28C28; --orange-t:#FFE0B8;
  --green:#1E9E5A; --green-t:#C9F0D8;
  --pink:#E8478B; --pink-t:#FFD3E5;
  --sun:#FFC93C; --bad:#D6372B; --good:#1E9E5A; --muted:#5b4636;
  --display:'Fredoka',system-ui,sans-serif; --body:'Nunito',system-ui,sans-serif;
  --accent:var(--orange); --accent-t:var(--orange-t);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:18px;line-height:1.35}
body{min-height:100%}
.strip{height:24px;background-color:var(--green);
  background-image:linear-gradient(135deg,var(--orange) 25%,transparent 25%),linear-gradient(225deg,var(--orange) 25%,transparent 25%),linear-gradient(315deg,var(--orange) 25%,transparent 25%),linear-gradient(45deg,var(--orange) 25%,transparent 25%);
  background-size:24px 24px;background-position:-12px 0,-12px 0,0 0,0 0;border-bottom:3px solid var(--ink)}
.wrap{max-width:780px;margin:0 auto;padding:16px}
header.top{display:flex;align-items:center;gap:12px;justify-content:space-between;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;cursor:pointer;border:0;background:none;padding:0;text-align:left;color:inherit;font:inherit}
.brand svg{width:64px;height:42px;flex:none}
.brand b{font-family:var(--display);font-size:32px;line-height:1;display:block;font-weight:700}
.fr{display:block;font-family:var(--body);font-style:normal;font-weight:800;font-size:.78em;color:#17693f;line-height:1.2;margin-top:2px}
.nofr .fr{display:none}
.switch{display:flex;align-items:center;gap:10px;border:3px solid var(--ink);border-radius:999px;background:#fff;padding:6px 14px 6px 8px;cursor:pointer;font-family:var(--display);font-weight:600;font-size:17px;color:var(--ink)}
.switch i{width:44px;height:24px;border-radius:999px;border:3px solid var(--ink);background:#e7ddc8;position:relative;flex:none}
.switch i::after{content:"";position:absolute;top:1px;left:1px;width:16px;height:16px;border-radius:50%;background:var(--ink);transition:transform .15s}
.switch[aria-checked="true"] i{background:var(--green)}
.switch[aria-checked="true"] i::after{transform:translateX(20px);background:#fff}
button{font:inherit;color:inherit}
:focus-visible{outline:4px solid var(--pink);outline-offset:3px}
main{margin-top:18px}
h1,h2{font-family:var(--display);font-weight:700;margin:0 0 12px;line-height:1.1;text-wrap:balance}
h2{font-size:30px}
.btn{font-family:var(--display);font-weight:600;font-size:20px;border:3px solid var(--ink);border-radius:16px;background:var(--sun);color:var(--ink);box-shadow:0 5px 0 var(--ink);padding:10px 20px;cursor:pointer;transition:transform .08s,box-shadow .08s}
.btn:hover{transform:translateY(-1px)}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.btn.alt{background:#fff}
.btn[disabled]{opacity:.45;cursor:default;transform:none;box-shadow:0 5px 0 var(--ink)}
.btn .fr{color:var(--ink);opacity:.8;font-size:.66em}
.row{display:flex;gap:12px;flex-wrap:wrap}
.row.between{justify-content:space-between;align-items:center}
.back{margin-bottom:14px}
.back .btn{font-size:16px;padding:6px 14px;box-shadow:0 3px 0 var(--ink)}

/* Inici */
.cats{display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));margin-top:14px}
.catcard{border:3px solid var(--ink);border-radius:24px;background:var(--accent-t);box-shadow:7px 7px 0 var(--ink);padding:14px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:10px;transition:transform .1s}
.catcard:hover{transform:translate(-2px,-2px)}
.catcard:active{transform:translate(4px,4px);box-shadow:3px 3px 0 var(--ink)}
.catcard .art{border-radius:16px}
.catcard .name{font-family:var(--display);font-weight:700;font-size:26px;line-height:1.05}
.stars{font-size:22px;letter-spacing:2px;color:var(--ink)}
.stars .off{color:#0003}
[data-cat="inst"]{--accent:var(--orange);--accent-t:var(--orange-t)}
[data-cat="fig"]{--accent:var(--green);--accent-t:var(--green-t)}
[data-cat="sym"]{--accent:var(--pink);--accent-t:var(--pink-t)}

.art{background:#fff;border:3px solid var(--ink);border-radius:20px;width:100%;aspect-ratio:200/130;overflow:hidden}
.art svg{width:100%;height:100%;display:block}

/* Passos */
.steps{display:grid;gap:16px;margin-top:10px}
.step{display:flex;align-items:center;gap:16px;border:3px solid var(--ink);border-radius:22px;background:var(--accent-t);box-shadow:6px 6px 0 var(--ink);padding:14px 16px;cursor:pointer;text-align:left;width:100%}
.step:active{transform:translate(3px,3px);box-shadow:3px 3px 0 var(--ink)}
.step .n{flex:none;width:52px;height:52px;border-radius:50%;background:var(--accent);border:3px solid var(--ink);display:grid;place-items:center;font-family:var(--display);font-weight:700;font-size:28px}
.step .t{font-family:var(--display);font-weight:600;font-size:23px;line-height:1.1;flex:1}
.step .stars{flex:none}

/* Aprèn */
.learn{display:grid;gap:14px}
.learncard{border:3px solid var(--ink);border-radius:26px;background:var(--accent-t);box-shadow:7px 7px 0 var(--ink);padding:16px;display:grid;gap:14px}
.wordbox{display:flex;align-items:center;gap:12px;flex-wrap:wrap;justify-content:space-between}
.word{font-family:var(--display);font-weight:700;font-size:44px;line-height:1}
.word .fr{font-size:.42em;margin-top:6px}
.frword{font-family:var(--display);font-weight:600;font-size:.5em;color:var(--muted)}
.fact{background:#fff;border:3px dashed var(--ink);border-radius:14px;padding:10px 14px;font-weight:800}
.say{display:flex;gap:10px;flex-wrap:wrap}
.say .btn{font-size:17px;padding:8px 14px;display:flex;align-items:center;gap:8px;background:#fff;box-shadow:0 4px 0 var(--ink)}
.say svg{width:22px;height:22px}
.dots{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.dots i{width:12px;height:12px;border-radius:50%;border:2.5px solid var(--ink);background:#fff}
.dots i.on{background:var(--accent)}
.dots i.cur{transform:scale(1.35);background:var(--ink)}

/* Joc */
.bar{height:18px;border:3px solid var(--ink);border-radius:999px;background:#fff;overflow:hidden}
.bar b{display:block;height:100%;background:var(--accent);transition:width .25s}
.count{font-family:var(--display);font-weight:600;font-size:20px;text-align:right}
.stim{margin:14px 0}
.stim .art{max-width:440px;margin:0 auto}
.bubble{max-width:440px;margin:14px auto;background:#fff;border:3px solid var(--ink);border-radius:26px;box-shadow:6px 6px 0 var(--ink);padding:18px;text-align:center}
.bubble .big{font-family:var(--display);font-weight:700;font-size:52px;line-height:1.05;overflow-wrap:anywhere}
.bubble .say{justify-content:center;margin-top:10px}
.prompt{text-align:center;font-size:28px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:8px}
.opt{border:3px solid var(--ink);border-radius:18px;background:#fff;box-shadow:0 6px 0 var(--ink);padding:14px 10px;min-height:76px;cursor:pointer;font-family:var(--display);font-weight:600;font-size:26px;line-height:1.05;text-align:center;overflow-wrap:anywhere}
.opt:hover:not([disabled]){background:var(--accent-t)}
.opt:active:not([disabled]){transform:translateY(5px);box-shadow:0 1px 0 var(--ink)}
.opt .fr{font-size:.5em}
.opt.good{background:var(--good);color:#fff;animation:pop .3s}
.opt.good .fr{color:#fff}
.opt.bad{background:var(--bad);color:#fff;animation:shake .35s}
.opt.bad .fr{color:#fff}
.opt[disabled]{cursor:default}
.opt[disabled]:not(.good):not(.bad){opacity:.55}
.fb{min-height:96px;margin-top:18px;display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between}
.fb .msg{font-family:var(--display);font-weight:600;font-size:24px;line-height:1.1;flex:1;min-width:200px}
.fb .msg.good{color:#127a43}.fb .msg.bad{color:var(--bad)}
@keyframes pop{50%{transform:scale(1.06)}}
@keyframes shake{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}

.write{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:6px}
.write .pre{font-family:var(--display);font-weight:700;font-size:32px}
.write input{font-family:var(--display);font-weight:600;font-size:32px;width:100%;max-width:340px;border:3px solid var(--ink);border-radius:16px;padding:8px 14px;background:#fff;color:var(--ink);box-shadow:0 5px 0 var(--ink)}
.write input:disabled{background:var(--accent-t)}
.chars{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:8px}
.ch{width:44px;height:44px;border:3px solid var(--ink);border-radius:12px;background:var(--accent-t);font-family:var(--display);font-weight:600;font-size:24px;cursor:pointer;box-shadow:0 3px 0 var(--ink)}
.ch:active{transform:translateY(3px);box-shadow:none}

/* Guia */
.hello{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;margin:6px 0 18px}
.hi{font-family:var(--display);font-weight:700;font-size:44px;line-height:1}
.hi .fr{font-size:.45em}
.go{display:flex;flex-direction:column;align-items:center;gap:2px;width:100%;max-width:460px;padding:16px 20px;background:var(--orange);box-shadow:0 7px 0 var(--ink);animation:bob 1.8s ease-in-out infinite}
.go .gt{font-size:34px;line-height:1.1}
.go .gs{font-size:17px;font-weight:600}
.go .gs .fr{color:var(--ink);opacity:.85}
@keyframes bob{50%{transform:translateY(-4px)}}
.how{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:460px;margin:0 auto 22px}
.tile{background:#fff;border:3px solid var(--ink);border-radius:18px;padding:10px 6px;text-align:center}
.tile .ti svg{width:46px;height:32px}
.tile .tt{font-family:var(--display);font-weight:600;font-size:20px;line-height:1.05}
.tile .tt .fr{font-size:.62em}
.tag{position:absolute;top:-12px;right:14px;background:var(--ink);color:#fff;font-family:var(--display);font-weight:600;font-size:15px;border-radius:999px;padding:2px 12px}
.tag .fr{display:none}
.catcard,.step{position:relative}
.catcard.isnext{outline:5px solid var(--ink);outline-offset:3px}
.step.done{opacity:.92}
.step.done .n{background:var(--good);color:#fff}
.step.next{background:#fff;outline:5px solid var(--ink);outline-offset:3px}
.art.tap{cursor:pointer}
.art.tap:active{transform:scale(.98)}
.msg.good{font-family:var(--display);font-weight:600;font-size:26px;color:#127a43}
/* Resultat */
.result{text-align:center;display:grid;gap:14px;justify-items:center}
.result .stars.big{font-size:64px;letter-spacing:6px}
.result .score{font-family:var(--display);font-weight:700;font-size:40px}
.missed{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;max-width:560px}
.chip{background:#fff;border:3px solid var(--ink);border-radius:14px;padding:6px 12px;font-family:var(--display);font-weight:600;font-size:20px;text-align:center}
.chip .fr{font-size:.6em}
.hint{color:var(--muted);font-weight:700;font-size:15px}
@media (max-width:420px){
  html,body{font-size:17px}
  .brand b{font-size:26px}.word{font-size:36px}.opt{font-size:22px}.bubble .big{font-size:40px}
  h2{font-size:26px}.step .t{font-size:20px}.step .stars{display:none}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body class="">
<div class="strip" aria-hidden="true"></div>
<div class="wrap">
  <header class="top">
    <button class="brand" data-act="home" aria-label="Inici">
      <svg viewBox="0 0 64 42" aria-hidden="true">
        <g stroke="#2a1d14" stroke-width="2" opacity=".7"><line x1="0" x2="64" y1="6" y2="6"/><line x1="0" x2="64" y1="14" y2="14"/><line x1="0" x2="64" y1="22" y2="22"/><line x1="0" x2="64" y1="30" y2="30"/><line x1="0" x2="64" y1="38" y2="38"/></g>
        <ellipse cx="14" cy="30" rx="8" ry="6" fill="#F28C28" stroke="#2a1d14" stroke-width="2.5" transform="rotate(-20 14 30)"/><line x1="21" y1="29" x2="21" y2="6" stroke="#2a1d14" stroke-width="3"/>
        <ellipse cx="42" cy="22" rx="8" ry="6" fill="#1E9E5A" stroke="#2a1d14" stroke-width="2.5" transform="rotate(-20 42 22)"/><line x1="49" y1="21" x2="49" y2="0" stroke="#2a1d14" stroke-width="3"/>
      </svg>
      <span><b>Música en català</b><span class="fr">La musique en catalan</span></span>
    </button>
    <button class="switch" id="frSwitch" role="switch" aria-checked="true"><i></i><span>Français</span></button>
  </header>
  <main id="app" tabindex="-1"></main>
</div>

<script>
(()=>{
const INK='#2a1d14';
let store={fr:true,stars:{}};
try{const s=JSON.parse(localStorage.getItem('musicaCat')||'null');if(s)store=Object.assign(store,s);}catch(e){}
const save=()=>{try{localStorage.setItem('musicaCat',JSON.stringify(store));}catch(e){}};

/* ---------- Tipografia de claus (Noto Music) ---------- */
let fontOK=false;
const fontReady=Promise.race([
  (document.fonts?document.fonts.load('60px "Noto Music"','\u{1D11E}\u{1D122}').then(r=>{fontOK=r.length>0;}):Promise.resolve()).catch(()=>{}),
  new Promise(r=>setTimeout(r,3000))
]);
function fitClefs(root){
  const cv=document.createElement('canvas').getContext('2d');
  root.querySelectorAll('text[data-g]').forEach(t=>{
    cv.font='100px "Noto Music"';
    const m=cv.measureText(t.dataset.g),asc=m.actualBoundingBoxAscent,h=asc+m.actualBoundingBoxDescent;
    if(!h)return;
    const s=(+t.dataset.h)/h,ink=(m.actualBoundingBoxRight-m.actualBoundingBoxLeft)/2;
    t.setAttribute('transform',`translate(${+t.dataset.cx-s*ink} ${+t.dataset.top+s*asc}) scale(${s})`);
  });
}

/* ---------- Dibuixos ---------- */
const S=inner=>`<svg viewBox="0 0 200 130" aria-hidden="true">${inner}</svg>`;
const L=(x1,y1,x2,y2,w=4,c=INK,extra='')=>`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${c}" stroke-width="${w}" stroke-linecap="round" ${extra}/>`;
const staff=(x1=18,x2=182)=>[35,50,65,80,95].map(y=>L(x1,y,x2,y,2,INK,'opacity=".7"')).join('');
const head=(cx,cy,filled=true)=>`<ellipse cx="${cx}" cy="${cy}" rx="12" ry="8.5" transform="rotate(-20 ${cx} ${cy})" fill="${filled?INK:'#fff'}" stroke="${INK}" stroke-width="${filled?1:4.5}"/>`;
const stem=(cx,cy,len=50)=>L(cx+11,cy-2,cx+11,cy-len,3.5);
const flag=(cx,top,dy=0)=>`<path d="M${cx+11},${top+dy} C${cx+13},${top+dy+16} ${cx+31},${top+dy+22} ${cx+26},${top+dy+42}" fill="none" stroke="${INK}" stroke-width="4.5" stroke-linecap="round"/>`;
const clef=(g,top,h,cx)=>`<text data-g="${g}" data-top="${top}" data-h="${h}" data-cx="${cx}" x="0" y="0" font-family="'Noto Music'" font-size="100" fill="${INK}"></text>`;

const D={
 /* instruments */
 tambor:()=>S(`<path d="M55,52 V98 A45,12 0 0 0 145,98 V52 Z" fill="#E4572E" stroke="${INK}" stroke-width="3.5"/><path d="M55,64 L77,94 L100,64 L123,94 L145,64" fill="none" stroke="#FFE3B0" stroke-width="3"/><ellipse cx="100" cy="52" rx="45" ry="12" fill="#FFF0CC" stroke="${INK}" stroke-width="3.5"/>${L(152,12,112,46,5)}${L(48,12,88,46,5)}<circle cx="152" cy="12" r="6" fill="#FFC93C" stroke="${INK}" stroke-width="3"/><circle cx="48" cy="12" r="6" fill="#FFC93C" stroke="${INK}" stroke-width="3"/>`),
 pandereta:()=>{let j='';for(let i=0;i<8;i++){const a=i*Math.PI/4+.4;j+=`<circle cx="${100+39*Math.cos(a)}" cy="${65+39*Math.sin(a)}" r="5.5" fill="#fff" stroke="${INK}" stroke-width="2.5"/>`;}
   return S(`<circle cx="100" cy="65" r="47" fill="#FFC93C" stroke="${INK}" stroke-width="3.5"/><circle cx="100" cy="65" r="31" fill="#FFF6D8" stroke="${INK}" stroke-width="3"/>${j}`);},
 triangle:()=>S(`<path d="M100,26 L152,102 H48 Z" fill="none" stroke="${INK}" stroke-width="12" stroke-linejoin="round"/><path d="M100,26 L152,102 H48 Z" fill="none" stroke="#C9D6DF" stroke-width="6" stroke-linejoin="round"/>${L(100,26,100,10,3)}${L(162,26,122,70,5)}<circle cx="162" cy="26" r="7" fill="#E4572E" stroke="${INK}" stroke-width="3"/>`),
 maraques:()=>{const dots=(cx,cy)=>`<circle cx="${cx-8}" cy="${cy-6}" r="3.5" fill="#fff" opacity=".85"/><circle cx="${cx+7}" cy="${cy+2}" r="3.5" fill="#fff" opacity=".85"/><circle cx="${cx-5}" cy="${cy+10}" r="3.5" fill="#fff" opacity=".85"/>`;
   return S(`<g transform="rotate(-18 70 70)">${L(70,66,70,118,10,'#8B5A2B')}<circle cx="70" cy="46" r="27" fill="#E4572E" stroke="${INK}" stroke-width="3.5"/>${dots(70,46)}</g><g transform="rotate(18 130 70)">${L(130,66,130,118,10,'#8B5A2B')}<circle cx="130" cy="46" r="27" fill="#1E9E5A" stroke="${INK}" stroke-width="3.5"/>${dots(130,46)}</g>`);},
 xilofon:()=>{const col=['#E4572E','#F28C28','#FFC93C','#1E9E5A','#2CA6A4','#7B4FD1','#E8478B'];let b='';
   col.forEach((c,i)=>{const h=76-i*6;b+=`<rect x="${30+i*20.5}" y="${72-h/2}" width="18" height="${h}" rx="4" fill="${c}" stroke="${INK}" stroke-width="3"/>`;});
   return S(`${L(26,54,174,54,5,'#8B5A2B')}${L(26,92,174,92,5,'#8B5A2B')}${b}${L(158,8,128,42,4)}${L(58,8,88,42,4)}<circle cx="128" cy="42" r="8" fill="#FFC93C" stroke="${INK}" stroke-width="3"/><circle cx="88" cy="42" r="8" fill="#FFC93C" stroke="${INK}" stroke-width="3"/>`);},
 djembe:()=>S(`<path d="M55,25 H145 C150,50 125,60 118,75 C115,90 125,100 135,114 H65 C75,100 85,90 82,75 C75,60 50,50 55,25 Z" fill="#B5651D" stroke="${INK}" stroke-width="3.5" stroke-linejoin="round"/><path d="M60,36 L80,58 L100,38 L120,58 L140,36" fill="none" stroke="#F3E2C0" stroke-width="3.5"/><path d="M84,76 l16,-9 l16,9 l-16,9 z" fill="#F3E2C0"/><path d="M72,108 H128" stroke="#F3E2C0" stroke-width="3.5"/><ellipse cx="100" cy="25" rx="45" ry="10" fill="#F3E2C0" stroke="${INK}" stroke-width="3.5"/>`),
 guitarra:()=>S(`<g transform="translate(100 66) rotate(38) translate(-70 -62)"><rect x="63" y="2" width="14" height="18" rx="3" fill="#3b2112" stroke="${INK}" stroke-width="3"/><rect x="65" y="18" width="10" height="46" fill="#5a341b" stroke="${INK}" stroke-width="2.5"/><circle cx="70" cy="90" r="27" fill="none" stroke="${INK}" stroke-width="7"/><circle cx="70" cy="62" r="20" fill="none" stroke="${INK}" stroke-width="7"/><circle cx="70" cy="90" r="27" fill="#E08A2E"/><circle cx="70" cy="62" r="20" fill="#E08A2E"/><rect x="65" y="40" width="10" height="26" fill="#5a341b"/><circle cx="70" cy="88" r="8.5" fill="${INK}"/><rect x="58" y="106" width="24" height="5" rx="2" fill="${INK}"/>${L(67,12,67,108,1.2,'#eee')}${L(70,12,70,108,1.2,'#eee')}${L(73,12,73,108,1.2,'#eee')}</g>`),
 violi:()=>S(`<g transform="translate(86 66) rotate(-26) translate(-70 -66)"><circle cx="70" cy="6" r="6" fill="#3b2112" stroke="${INK}" stroke-width="2.5"/><rect x="66" y="8" width="8" height="40" fill="#3b2112"/><path d="M70,40 C95,40 94,66 82,72 C98,82 98,118 70,118 C42,118 42,82 58,72 C46,66 45,40 70,40 Z" fill="#B5651D" stroke="${INK}" stroke-width="3.5" stroke-linejoin="round"/><path d="M60,84 q-3,8 0,16 M80,84 q3,8 0,16" fill="none" stroke="${INK}" stroke-width="3" stroke-linecap="round"/><rect x="64" y="104" width="12" height="9" rx="2" fill="${INK}"/>${L(69,10,69,106,1.2,'#eee')}${L(72,10,72,106,1.2,'#eee')}</g>${L(156,14,132,118,4,'#8B5A2B')}${L(150,16,126,116,1.6,'#f3f3f3')}`),

/* ---------- Utilitats ---------- */
const $=s=>document.querySelector(s);
const app=$('#app');
const T=(ca,fr)=>`${ca}<span class="fr">${fr}</span>`;
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const speakerSVG='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9v6h4l5 4V5L7 9H3z" fill="#2a1d14"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="#2a1d14" stroke-width="2.2" stroke-linecap="round"/></svg>';
const canSpeak='speechSynthesis' in window&&'SpeechSynthesisUtterance' in window;
function speak(text,lang){
  if(!canSpeak)return;
  try{const u=new SpeechSynthesisUtterance(text);u.lang=lang;u.rate=.8;speechSynthesis.cancel();speechSynthesis.speak(u);}catch(e){}
}
const bare=s=>s.replace(/^(el|la|els|les|l')\s*/i,'');
const frBare=s=>s.replace(/^(le|la|les|l')\s*/i,'');
const bestStars=k=>store.stars[k]||0;
const starsHTML=(n,max)=>`<span class="stars" aria-label="${n} de ${max} estrelles">${'★'.repeat(n)}<span class="off">${'★'.repeat(max-n)}</span></span>`;
const catStars=c=>['img','tr','wimg','wtr'].reduce((a,m)=>a+bestStars(c+'-'+m),0);
const sayBtns=(it)=>canSpeak?`<div class="say"><button class="btn" data-say="${it.ca}" data-lang="ca-ES">${speakerSVG}Català</button>${store.fr?`<button class="btn" data-say="${it.fr}" data-lang="fr-FR">${speakerSVG}Français</button>`:''}</div>`:'';

const state={screen:'home',cat:null,idx:0,mode:null,qs:[],q:0,score:0,missed:[],done:false};

function view(html,cat){
  app.dataset.cat=cat||'';
  app.innerHTML=html;
  fitClefs(app);
  window.scrollTo(0,0);
}

/* ---------- Pantalles ---------- */
const MODES=['learn','img','tr','wimg','wtr'];
const MLAB={learn:['Mira i aprèn','Regarde et apprends'],img:['Quin nom té?','Quel est son nom ?'],tr:['Com es diu en català?','Comment dit-on en catalan ?'],wimg:['Escriu el nom','Écris le nom'],wtr:['Escriu-ho en català','Écris-le en catalan']};
const isDone=(c,m)=>m==='learn'?!!(store.learned&&store.learned[c]):bestStars(c+'-'+m)>0;
const nextStep=c=>MODES.find(m=>!isDone(c,m));
const globalNext=()=>{for(const c of Object.keys(CATS)){const m=nextStep(c);if(m)return{cat:c,mode:m};}return null;};
const started=()=>Object.keys(CATS).some(c=>MODES.some(m=>isDone(c,m)));
const eyeSVG='<svg viewBox="0 0 48 32" aria-hidden="true"><path d="M3,16 Q24,-2 45,16 Q24,34 3,16 Z" fill="#fff" stroke="#2a1d14" stroke-width="3"/><circle cx="24" cy="16" r="7" fill="#2a1d14"/></svg>';
const penSVG='<svg viewBox="0 0 48 32" aria-hidden="true"><path d="M8,26 L12,16 L34,4 L42,12 L20,26 Z" fill="#FFC93C" stroke="#2a1d14" stroke-width="3" stroke-linejoin="round"/><path d="M8,26 L12,16 L18,22 Z" fill="#2a1d14"/></svg>';
const howTile=(svg,ca,fr)=>`<div class="tile"><div class="ti">${svg}</div><div class="tt">${T(ca,fr)}</div></div>`;

function home(){
  state.screen='home';
  const g=globalNext(),begun=started();
  view(`<div class="hello">
    <div class="hi">${T('Hola!','Bonjour !')}</div>
    ${g?`<button class="btn go" data-act="step" data-cat="${g.cat}" data-mode="${g.mode}"><span class="gt">${begun?T('Continua','Continue'):T('Comença','Commence')} →</span><span class="gs">${CATS[g.cat].ca} · ${MLAB[g.mode][0]}<span class="fr">${CATS[g.cat].fr} · ${MLAB[g.mode][1]}</span></span></button>`
    :`<div class="msg good">${T('Fantàstic! Ho has fet tot.','Fantastique ! Tu as tout fait.')}</div>`}
  </div>
  <div class="how" aria-label="Com funciona">
    ${howTile(eyeSVG,'Mira','Regarde')}${howTile(speakerSVG,'Escolta','Écoute')}${howTile(penSVG,'Escriu','Écris')}
  </div>
  <h2>${T('O tria què vols practicar','Ou choisis ce que tu veux pratiquer')}</h2>
  <div class="cats">${Object.keys(CATS).map(id=>`
    <button class="catcard ${g&&g.cat===id?'isnext':''}" data-act="cat" data-id="${id}" data-cat="${id}">
      ${g&&g.cat===id?`<span class="tag">${T('Aquí','Ici')}</span>`:''}
      <div class="art">${D[CAT_SAMPLE[id]]()}</div>
      <div class="name">${T(CATS[id].ca,CATS[id].fr)}</div>
      ${starsHTML(catStars(id),12)}
    </button>`).join('')}</div>`);
}

async function goStep(c,m){
  await fontReady;
  state.cat=c;
  if(m==='learn')learn(0);else startQuiz(m);
}

async function catMenu(id){
  await fontReady;
  state.screen='cat';state.cat=id;
  const c=CATS[id],nx=nextStep(id);
  view(`<div class="back"><button class="btn alt" data-act="home">← ${T('Inici','Accueil')}</button></div>
  <h2>${T(c.ca,c.fr)}</h2>
  <p class="hint" style="margin-top:-4px">${T('Fes els passos en ordre: 1, 2, 3, 4, 5.','Fais les étapes dans l\'ordre : 1, 2, 3, 4, 5.')}</p>
  <div class="steps">${MODES.map((m,i)=>{const d=isDone(id,m),nn=m===nx;
    return `<button class="step ${d?'done':''} ${nn?'next':''}" data-act="step" data-mode="${m}"><span class="n">${d?'✓':i+1}</span><span class="t">${T(MLAB[m][0],MLAB[m][1])}</span>${m==='learn'?'':starsHTML(bestStars(id+'-'+m),3)}${nn?`<span class="tag">${T('Aquí','Ici')}</span>`:''}</button>`;}).join('')}
  </div>`,id);
}

function learn(i){
  const list=itemsOf(state.cat),n=list.length;
  state.screen='learn';state.idx=Math.max(0,Math.min(n-1,i));
  const x=list[state.idx],last=state.idx===n-1;
  if(last){store.learned=store.learned||{};store.learned[state.cat]=true;save();}
  view(`<div class="back"><button class="btn alt" data-act="cat" data-id="${state.cat}">← ${T('Enrere','Retour')}</button></div>
  <h2>${T('Mira i escolta','Regarde et écoute')}</h2>
  <div class="learn"><div class="learncard">
    <div class="art tap" ${canSpeak?`data-say="${x.ca}" data-lang="ca-ES" role="button" tabindex="0" aria-label="Escolta"`:''}>${x.draw()}</div>
    ${canSpeak?`<p class="hint" style="margin:0;text-align:center">${T('Toca el dibuix per escoltar.','Touche le dessin pour écouter.')}</p>`:''}
    <div class="wordbox"><div class="word">${x.ca}<span class="fr">${x.fr}</span></div></div>
    <div class="fact">${T(x.fact[0],x.fact[1])}</div>
    ${sayBtns(x)}
  </div>
  <div class="dots" aria-hidden="true">${list.map((_,k)=>`<i class="${k<state.idx?'on':''} ${k===state.idx?'cur':''}"></i>`).join('')}</div>
  <div class="row between">
    <button class="btn alt" data-act="prev" ${state.idx===0?'disabled':''}>← ${T('Abans','Avant')}</button>
    <span class="count">${state.idx+1} / ${n}</span>
    ${last?`<button class="btn" data-act="quiz" data-mode="img">${T('Ara, a jugar!','On joue !')}</button>`:`<button class="btn" data-act="next">${T('Després','Après')} →</button>`}
  </div></div>`,state.cat);
  if(canSpeak)speak(x.ca,'ca-ES');
}

function startQuiz(mode){
  const all=itemsOf(state.cat);
  state.phase='try';state.hints=0;
  const pool=(mode==='tr'||mode==='wtr')?all.filter(i=>bare(i.ca).toLowerCase()!==frBare(i.fr).toLowerCase()):all;
  state.mode=mode;state.score=0;state.q=0;state.missed=[];
  state.qs=shuffle(pool).slice(0,Math.min(10,pool.length)).map(x=>({x,opts:shuffle([x,...shuffle(all.filter(o=>o.ca!==x.ca)).slice(0,3)])}));
  question();
}

function question(){
  state.screen='quiz';
  const {x,opts}=state.qs[state.q],n=state.qs.length,img=state.mode==='img'||state.mode==='wimg',wr=state.mode[0]==='w';
  state.phase='try';state.hints=0;
  const stim=img?`<div class="stim"><div class="art">${x.draw()}</div></div>`
    :`<div class="bubble"><div class="big">${x.fr}</div>${canSpeak?`<div class="say"><button class="btn" data-say="${x.fr}" data-lang="fr-FR">${speakerSVG}Français</button></div>`:''}</div>`;
  view(`<div class="back"><button class="btn alt" data-act="cat" data-id="${state.cat}">← ${T('Sortir','Quitter')}</button></div>
  <div class="row between" style="margin-bottom:6px"><div class="bar" style="flex:1;min-width:120px"><b style="width:${state.q/n*100}%"></b></div><span class="count">${state.q+1} / ${n}</span></div>
  ${stim}
  ${wr?writeBlock(x):`<h2 class="prompt">${img?T('Quin nom té?','Quel est son nom ?'):T('Com es diu en català?','Comment dit-on en catalan ?')}</h2>
  <div class="opts">${opts.map((o,i)=>`<button class="opt" data-act="ans" data-i="${i}">${o.ca}${img&&store.fr?`<span class="fr">${o.fr}</span>`:''}</button>`).join('')}</div>`}
  <div class="fb" id="fb" aria-live="polite"></div>`,state.cat);
  if(wr)$('#ans').focus();
}

/* ---------- Escriure ---------- */
const artOf=s=>{const m=s.match(/^(el|la|els|les|l')\s*/i);return m?m[1].toLowerCase():'';};
const norm=s=>s.trim().toLowerCase().replace(/\s+/g,' ').replace(/^(el|la|els|les|l')\s*/,'');
const strip=s=>s.normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[·.]/g,'');
function writeBlock(x){
  const a=artOf(x.ca),word=bare(x.ca);
  return `<h2 class="prompt">${T('Escriu el nom en català','Écris le nom en catalan')}</h2>
  <div class="write"><span class="pre">${a}</span><input id="ans" type="text" lang="ca" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Nom en català"></div>
  <p class="hint" style="text-align:center;margin:6px 0">${word.split(' ').map(w=>w.length).join(' + ')} ${T('lletres','lettres')}</p>
  <div class="chars" aria-label="Lletres especials">${[...'àèéíïòóúüç·'].map(c=>`<button type="button" class="ch" data-act="ch" data-c="${c}">${c}</button>`).join('')}</div>
  <div class="row" style="justify-content:center;margin-top:14px"><button class="btn alt" data-act="hint" id="hintBtn">${T('Pista','Indice')}</button><button class="btn" data-act="check" id="checkBtn">${T('Comprova','Vérifie')}</button></div>`;
}
function nextBtn(){const last=state.q===state.qs.length-1;return `<button class="btn" data-act="nextq">${last?T('Veure el resultat','Voir le résultat'):T('Següent','Suivant')} →</button>`;}
function check(){
  const {x}=state.qs[state.q],inp=$('#ans'),fb=$('#fb');
  if(!inp||inp.disabled)return;
  const v=norm(inp.value),want=bare(x.ca).toLowerCase();
  if(!v){inp.focus();return;}
  const lock=()=>{inp.disabled=true;$('#checkBtn').disabled=true;$('#hintBtn').disabled=true;};
  if(state.phase==='copy'){
    if(v===want){lock();fb.innerHTML=`<div class="msg good">${T('Molt bé! Ara ja ho saps.','Très bien ! Maintenant tu le sais.')}</div>${nextBtn()}`;$('#fb .btn').focus();speak(x.ca,'ca-ES');}
    else{fb.innerHTML=`<div class="msg bad">${T(`Copia-ho igual: <b>${bare(x.ca)}</b>`,`Copie-le pareil : <b>${bare(x.ca)}</b>`)}</div>`;inp.focus();}
    return;
  }
  const res=v===want?'ok':strip(v)===strip(want)?'acc':'bad';
  if(res!=='bad'){
    state.score++;if(state.hints)state.missed.push(x);
    lock();
    fb.innerHTML=`<div class="msg good">${res==='ok'?T('Molt bé!','Très bien !'):T(`Gairebé perfecte! S'escriu <b>${bare(x.ca)}</b>.`,`Presque parfait ! Ça s'écrit <b>${bare(x.ca)}</b>.`)}</div>${nextBtn()}`;
    $('#fb .btn').focus();speak(x.ca,'ca-ES');
  }else{
    state.missed.push(x);state.phase='copy';
    inp.value='';
    fb.innerHTML=`<div class="msg bad">${T(`Gairebé! Es diu <b>${x.ca}</b>. Ara escriu-ho tu.`,`Presque ! Ça s'appelle <b>${x.ca}</b>. Maintenant écris-le.`)}</div>`;
    $('#hintBtn').hidden=true;
    inp.focus();speak(x.ca,'ca-ES');
  }
}
function hint(){
  const {x}=state.qs[state.q],inp=$('#ans');if(!inp||inp.disabled)return;
  const want=bare(x.ca).toLowerCase();
  state.hints=Math.min(state.hints+1,want.length);
  inp.value=want.slice(0,state.hints);inp.focus();
}
function insertChar(c){
  const inp=$('#ans');if(!inp||inp.disabled)return;
  const a=inp.selectionStart??inp.value.length,b=inp.selectionEnd??a;
  inp.value=inp.value.slice(0,a)+c+inp.value.slice(b);
  inp.setSelectionRange(a+1,a+1);inp.focus();
}

function answer(i){
  const {x,opts}=state.qs[state.q];
  const btns=[...app.querySelectorAll('.opt')];
  if(btns[0].disabled)return;
  const ok=opts[i].ca===x.ca;
  btns.forEach((b,k)=>{b.disabled=true;if(opts[k].ca===x.ca)b.classList.add('good');});
  if(ok)state.score++;else{btns[i].classList.add('bad');state.missed.push(x);}
  const last=state.q===state.qs.length-1;
  $('#fb').innerHTML=`<div class="msg ${ok?'good':'bad'}">${ok?T('Molt bé!','Très bien !'):T(`Gairebé! Es diu <b>${x.ca}</b>.`,`Presque ! Ça s'appelle <b>${x.ca}</b>.`)}</div>
   <button class="btn" data-act="nextq">${last?T('Veure el resultat','Voir le résultat'):T('Següent','Suivant')} →</button>`;
  $('#fb .btn').focus();
  speak(x.ca,'ca-ES');
}

function results(){
  state.screen='result';
  const n=state.qs.length,pct=state.score/n,st=pct>=.9?3:pct>=.6?2:1;
  const k=state.cat+'-'+state.mode;
  if(st>bestStars(k)){store.stars[k]=st;save();}
  const msg=st===3?T('Fantàstic! Ho has fet molt bé.','Fantastique ! Tu as très bien réussi.')
    :st===2?T('Molt bé! Una mica més i ho tens.','Très bien ! Encore un peu et c\'est parfait.')
    :T('Bon intent! Torna-ho a provar.','Bien essayé ! Essaie encore.');
  view(`<div class="result">
    <h2>${msg}</h2>
    <div class="stars big">${'★'.repeat(st)}<span class="off">${'★'.repeat(3-st)}</span></div>
    <div class="score">${state.score} / ${n}</div>
    ${state.missed.length?`<div><div class="hint">${T('Repassa aquestes paraules:','Révise ces mots :')}</div><div class="missed" style="margin-top:8px">${state.missed.map(m=>`<div class="chip">${m.ca}<span class="fr">${m.fr}</span></div>`).join('')}</div></div>`:''}
    <div class="row" style="justify-content:center">${(()=>{
      const nxt=MODES[MODES.indexOf(state.mode)+1];
      const retry=(p)=>`<button class="btn ${p?'':'alt'}" data-act="step" data-mode="${state.mode}">${T('Torna-ho a provar','Réessayer')}</button>`;
      const menu=`<button class="btn alt" data-act="cat" data-id="${state.cat}">${T('Menú','Menu')}</button>`;
      const next=nxt?`<button class="btn" data-act="step" data-mode="${nxt}">${T('Següent pas','Étape suivante')} →</button>`:`<button class="btn" data-act="home">${T('Has acabat! Torna a l\'inici','Terminé ! Retour à l\'accueil')}</button>`;
      return st===1?retry(true)+menu:next+retry(false)+menu;})()}
    </div></div>`,state.cat);
}

/* ---------- Esdeveniments ---------- */
app.addEventListener('click',async e=>{
  const s=e.target.closest('[data-say]');
  if(s){speak(s.dataset.say,s.dataset.lang);return;}
  const b=e.target.closest('[data-act]');if(!b)return;
  const a=b.dataset.act;
  if(a==='home')home();
  else if(a==='cat')catMenu(b.dataset.id);
  else if(a==='step')goStep(b.dataset.cat||state.cat,b.dataset.mode);
  else if(a==='learn'){await fontReady;learn(0);}
  else if(a==='prev')learn(state.idx-1);
  else if(a==='next')learn(state.idx+1);
  else if(a==='quiz'){await fontReady;startQuiz(b.dataset.mode);}
  else if(a==='ans')answer(+b.dataset.i);
  else if(a==='check')check();
  else if(a==='hint')hint();
  else if(a==='ch')insertChar(b.dataset.c);
  else if(a==='nextq'){if(state.q<state.qs.length-1){state.q++;question();}else results();}
});
document.querySelector('.brand').addEventListener('click',home);
app.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='ans'){e.preventDefault();check();}});
app.addEventListener('mousedown',e=>{if(e.target.closest('.ch'))e.preventDefault();});
const sw=$('#frSwitch');
function applyFr(){
  document.body.classList.toggle('nofr',!store.fr);
  sw.setAttribute('aria-checked',String(store.fr));
}
sw.addEventListener('click',()=>{
  store.fr=!store.fr;save();applyFr();
  if(state.screen==='learn')learn(state.idx);
  else if(state.screen==='quiz'&&state.mode[0]!=='w'&&!app.querySelector('.opt[disabled]')){question();}
});
applyFr();home();
})();
</script>
</body>
</html>
