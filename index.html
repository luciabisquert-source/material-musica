<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Materials de Música · INS Ermengol IV</title>
<style>
:root{
  --bg:#faf8f4; --card:#ffffff; --ink:#1f2430; --muted:#6b7280; --line:#e6e1d8;
  --accent:#b4432b; --accent-soft:#f6e3dd; --chip:#f0ece4; --chip-on:#1f2430; --chip-on-ink:#fff;
  --t-P:#c2410c; --t-D:#1d4ed8; --t-A:#047857; --t-F:#7c3aed;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#16181d; --card:#1e2128; --ink:#ecebe6; --muted:#9aa0ab; --line:#2f333c;
  --accent:#f08a6e; --accent-soft:#3a2620; --chip:#272b34; --chip-on:#ecebe6; --chip-on-ink:#16181d;
  --t-P:#fb923c; --t-D:#60a5fa; --t-A:#34d399; --t-F:#a78bfa;}
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Georgia,'Times New Roman',serif}
.wrap{max-width:1080px;margin:0 auto;padding:40px 20px 80px}
header h1{font-size:clamp(28px,5vw,44px);line-height:1.1;margin:0 0 6px;letter-spacing:-.01em}
header p{margin:0;color:var(--muted);font-family:system-ui,sans-serif;font-size:15px}
.sans{font-family:system-ui,-apple-system,Segoe UI,sans-serif}
.bar{margin:28px 0 14px;display:flex;gap:10px;flex-wrap:wrap}
.bar input{flex:1 1 260px;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:15px system-ui,sans-serif}
.bar input:focus{outline:2px solid var(--accent);outline-offset:1px}
.bar select{padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:15px system-ui,sans-serif}
.group{margin:14px 0}
.group h2{font:600 12px system-ui,sans-serif;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 8px}
.status{display:flex;justify-content:space-between;align-items:center;margin:22px 0 12px;font:14px system-ui,sans-serif;color:var(--muted)}
.clear{background:none;border:0;color:var(--accent);cursor:pointer;font:inherit;text-decoration:underline}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:14px}
.card{display:flex;flex-direction:column;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;text-decoration:none;color:inherit;transition:transform .12s,border-color .12s}
.card:hover{transform:translateY(-2px);border-color:var(--accent)}
.card:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.meta{display:flex;gap:8px;align-items:center;font:12px system-ui,sans-serif;color:var(--muted)}
.badge{font-weight:600;padding:2px 8px;border-radius:6px;background:var(--accent-soft);color:var(--bc,var(--accent))}
.card h3{margin:0;font-size:18px;line-height:1.25}
.jump{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 4px}
.jump a{font:600 13px system-ui,sans-serif;color:var(--ink);text-decoration:none;border:1px solid var(--line);background:var(--card);padding:6px 14px;border-radius:999px}
.jump a:hover{border-color:var(--accent);color:var(--accent)}
.course{margin:38px 0 0;scroll-margin-top:16px}
summary{list-style:none;cursor:pointer}
summary::-webkit-details-marker{display:none}
.course>summary{font-size:28px;font-weight:700;padding:8px 0;border-bottom:2px solid var(--ink);display:flex;align-items:baseline;gap:12px}
.course>summary::before{content:"▸";font-size:20px;color:var(--accent);transition:transform .15s;display:inline-block}
.course[open]>summary::before{transform:rotate(90deg)}
.course>summary small{font:13px system-ui,sans-serif;color:var(--muted);font-weight:400;margin-left:auto}
.course>summary:hover{color:var(--accent)}
.sub{margin:14px 0 0}
.sub>summary{font:700 13px system-ui,sans-serif;text-transform:uppercase;letter-spacing:.08em;margin:0 0 10px;display:flex;align-items:center;gap:8px;color:var(--bc);padding:4px 0}
.sub>summary::before{content:"▸";transition:transform .15s;display:inline-block}
.sub[open]>summary::before{transform:rotate(90deg)}
.sub>summary span{color:var(--muted);font-weight:400}
.empty{text-align:center;color:var(--muted);padding:60px 0;font-family:system-ui,sans-serif}
footer{margin-top:50px;color:var(--muted);font:13px system-ui,sans-serif;text-align:center}
</style>
</head>

var COURSES=[
 {id:"1r",title:"1r ESO",levels:["1r ESO"]},
 {id:"2n",title:"2n ESO",levels:["2n ESO"]},
 {id:"4t",title:"Optativa 4t ESO",levels:["4t ESO"]},
 {id:"altres",title:"Tutoria i materials transversals",levels:["Tutoria","Tots"]}
];
var SUBS=[
 {title:"Presentacions",types:["P"],color:"var(--t-P)"},
 {title:"Eines interactives",types:["A"],color:"var(--t-A)"},
 {title:"Documents i fitxes",types:["D","F"],color:"var(--t-D)"}
];
var state={q:""};
var openCourses=new Set(),closedSubs=new Set();
var $=function(id){return document.getElementById(id)};
function uniq(a){return Array.from(new Set(a))}

function norm(s){return s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"")}


function fmt(d){var p=d.split("-");return p[2]+"/"+p[1]+"/"+p[0]}

function render(){
  var q=norm(state.q.trim());
  var res=DATA.filter(function(d){
    if(q&&norm(d[0]).indexOf(q)<0)return false;
    return true;
  });
  var g=$("grid");g.innerHTML="";g.className="";
  var jump=$("jump");jump.innerHTML="";
  var filtering=!!state.q.trim();
  COURSES.forEach(function(c){
    var inCourse=res.filter(function(d){return c.levels.indexOf(d[2])>-1});
    if(!inCourse.length)return;
    var sec=document.createElement("details");sec.className="course";sec.id=c.id;
    sec.open=filtering||openCourses.has(c.id);
    sec.addEventListener("toggle",function(){if(filtering)return;sec.open?openCourses.add(c.id):openCourses.delete(c.id)});
    var h=document.createElement("summary");h.textContent=c.title;
    var sm=document.createElement("small");sm.textContent=inCourse.length+" materials";h.appendChild(sm);
    sec.appendChild(h);
    var ja=document.createElement("a");ja.href="#"+c.id;ja.textContent=c.title+" ("+inCourse.length+")";
    ja.addEventListener("click",function(){openCourses.add(c.id);sec.open=true});
    jump.appendChild(ja);
    SUBS.forEach(function(s){
      var items=inCourse.filter(function(d){return s.types.indexOf(d[1])>-1});
      if(!items.length)return;
      var sub=document.createElement("details");sub.className="sub";sub.style.setProperty("--bc",s.color);
      var sk=c.id+"|"+s.title;sub.open=!closedSubs.has(sk);
      sub.addEventListener("toggle",function(){sub.open?closedSubs.delete(sk):closedSubs.add(sk)});
      var h3=document.createElement("summary");h3.textContent=s.title+" ";
      var n=document.createElement("span");n.textContent="· "+items.length;h3.appendChild(n);
      var grid=document.createElement("div");grid.className="grid";
      items.forEach(function(d){grid.appendChild(card(d))});
      sub.appendChild(h3);sub.appendChild(grid);sec.appendChild(sub);
    });
    g.appendChild(sec);
  });
  $("count").textContent=res.length+" de "+DATA.length+" materials";
  $("empty").hidden=res.length>0;
  $("clear").hidden=!state.q;
}

function card(d){
    var a=document.createElement("a");a.className="card";a.href=BASE+d[5];a.target="_blank";a.rel="noopener";
    var m=document.createElement("div");m.className="meta";
    var b=document.createElement("span");b.className="badge";b.textContent=TYPES[d[1]];b.style.setProperty("--bc","var(--t-"+d[1]+")");
    var l=document.createElement("span");l.textContent=d[2]+" · "+fmt(d[4]);
    m.appendChild(b);m.appendChild(l);
    var h=document.createElement("h3");h.textContent=d[0];
    a.appendChild(m);a.appendChild(h);return a;
}

$("q").addEventListener("input",function(e){state.q=e.target.value;render()});
$("clear").addEventListener("click",function(){
  state={q:""};
  $("q").value="";render();
});
render();
</script>
