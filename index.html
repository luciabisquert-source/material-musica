@media (prefers-color-scheme:dark){

  --cP:#a66bff; --cA:#25d3da; --cD:#ff7da3; --shadow:0 4px 18px rgba(0,0,0,.35)}
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 'Poppins',system-ui,-apple-system,Segoe UI,sans-serif}
.hero{background:linear-gradient(120deg,#7d2ae8 0%,#5b5cf0 45%,#00c4cc 100%);color:#fff;padding:44px 20px 78px;position:relative;overflow:hidden}
.hero::before,.hero::after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.10)}
.hero::before{width:260px;height:260px;right:-60px;top:-90px}
.hero::after{width:150px;height:150px;left:42%;bottom:-80px}
.hero .in{max-width:1080px;margin:0 auto;position:relative;z-index:1}
.hero h1{margin:0;font-size:clamp(28px,5.5vw,46px);font-weight:800;line-height:1.1;letter-spacing:-.02em}
.hero p{margin:8px 0 0;opacity:.9;font-weight:500}
.search{margin-top:22px;max-width:460px;position:relative}
.search input{width:100%;padding:13px 18px 13px 44px;border:0;border-radius:999px;font:500 15px 'Poppins',sans-serif;color:#1c1b29;background:#fff;box-shadow:0 6px 20px rgba(0,0,0,.18)}
.search input:focus{outline:3px solid rgba(255,255,255,.6)}
.search span{position:absolute;left:17px;top:50%;transform:translateY(-50%);font-size:16px}
.wrap{max-width:1080px;margin:-44px auto 0;padding:0 20px 70px;position:relative;z-index:2}
.panel{background:var(--card);border-radius:22px;box-shadow:var(--shadow);padding:10px 10px 26px}
[role=tablist]{display:flex;gap:6px;flex-wrap:wrap}
.courses{padding:6px;border-bottom:1px solid var(--line);margin-bottom:14px}
.ctab{flex:1 1 150px;border:0;background:transparent;color:var(--muted);font:700 15px 'Poppins',sans-serif;padding:14px 12px;border-radius:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;transition:background .15s,color .15s}
.ctab:hover{background:var(--bg);color:var(--ink)}
.ctab[aria-selected=true]{background:linear-gradient(120deg,#7d2ae8,#5b5cf0);color:#fff;box-shadow:0 6px 14px rgba(125,42,232,.35)}
.ctab .n{font-size:12px;font-weight:600;padding:1px 8px;border-radius:999px;background:rgba(125,42,232,.12);color:var(--purple)}
.ctab[aria-selected=true] .n{background:rgba(255,255,255,.25);color:#fff}
.ctab:disabled{opacity:.35;cursor:default}
.types{padding:4px 12px 0;margin-bottom:6px}
.ttab{border:2px solid var(--line);background:transparent;color:var(--muted);font:600 14px 'Poppins',sans-serif;padding:8px 16px;border-radius:999px;cursor:pointer;display:flex;align-items:center;gap:7px}
.ttab:hover{border-color:var(--c)}
.ttab[aria-selected=true]{background:var(--c);border-color:var(--c);color:#fff}
.ttab .n{font-size:12px;opacity:.85}
.ttab:disabled{opacity:.35;cursor:default}
.ttab:disabled:hover{border-color:var(--line)}
.status{padding:10px 22px 0;color:var(--muted);font-size:13px;display:flex;justify-content:space-between}
.clear{background:none;border:0;color:var(--purple);font:600 13px 'Poppins',sans-serif;cursor:pointer;text-decoration:underline}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px;padding:14px 12px 0}
.card{display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;text-decoration:none;color:inherit;transition:transform .15s,box-shadow .15s}
.card:hover{transform:translateY(-4px);box-shadow:0 12px 26px rgba(80,40,160,.18)}
.card:focus-visible{outline:3px solid var(--purple);outline-offset:2px}
.thumb{height:84px;display:flex;align-items:center;justify-content:center;font-size:38px;background:linear-gradient(135deg,var(--c),var(--c2))}
.body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:6px;flex:1}
.body h3{margin:0;font-size:15.5px;font-weight:600;line-height:1.3}
.meta{margin-top:auto;padding-top:8px;display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted)}
.open{font-weight:700;color:var(--c)}
.empty{text-align:center;color:var(--muted);padding:56px 0 20px}
footer{margin-top:30px;text-align:center;color:var(--muted);font-size:13px}
</style>

var state={q:"",course:null,sub:null};
var $=function(id){return document.getElementById(id)};
function norm(s){return s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"")}
function fmt(d){var p=d.split("-");return p[2]+"/"+p[1]+"/"+p[0]}

function filtered(){
  var q=norm(state.q.trim());
  return DATA.filter(function(d){return !q||norm(d[0]).indexOf(q)>-1});
}
function inCourse(res,c){return res.filter(function(d){return c.levels.indexOf(d[2])>-1})}
function inSub(items,s){return items.filter(function(d){return s.types.indexOf(d[1])>-1})}

function fromHash(){
  var h=location.hash.slice(1).split("-");
  if(h.length===2){
    var c=COURSES.filter(function(x){return x.id===h[0]})[0],s=SUBS.filter(function(x){return x.id===h[1]})[0];
    if(c&&s){state.course=c.id;state.sub=s.id}
  }
}
function setHash(){try{history.replaceState(null,"","#"+state.course+"-"+state.sub)}catch(e){location.hash=state.course+"-"+state.sub}}

function render(){
  var res=filtered();
  // choose valid course
  var cur=COURSES.filter(function(c){return c.id===state.course})[0];
  if(!cur||!inCourse(res,cur).length){
    cur=COURSES.filter(function(c){return inCourse(res,c).length})[0]||COURSES[0];
    state.course=cur.id;
  }
  var cItems=inCourse(res,cur);
  var sub=SUBS.filter(function(s){return s.id===state.sub})[0];
  if(!sub||!inSub(cItems,sub).length){
    sub=SUBS.filter(function(s){return inSub(cItems,s).length})[0]||SUBS[0];
    state.sub=sub.id;
  }

  var ct=$("courses");ct.innerHTML="";
  COURSES.forEach(function(c){
    var n=inCourse(res,c).length;
    var b=document.createElement("button");b.type="button";b.className="ctab";b.setAttribute("role","tab");
    b.setAttribute("aria-selected",c.id===cur.id);b.disabled=!n;
    b.innerHTML=c.icon+" <span></span> <span class='n'>"+n+"</span>";b.children[0].textContent=c.title;
    b.onclick=function(){state.course=c.id;render()};
    ct.appendChild(b);
  });

  var tt=$("types");tt.innerHTML="";
  SUBS.forEach(function(s){
    var n=inSub(cItems,s).length;
    var b=document.createElement("button");b.type="button";b.className="ttab";b.setAttribute("role","tab");
    b.style.setProperty("--c",s.c);b.setAttribute("aria-selected",s.id===sub.id);b.disabled=!n;
    b.innerHTML=s.icon+" <span></span> <span class='n'>"+n+"</span>";b.children[0].textContent=s.title;
    b.onclick=function(){state.sub=s.id;render()};
    tt.appendChild(b);
  });

  var items=inSub(cItems,sub);
  var g=$("grid");g.innerHTML="";
  items.forEach(function(d){g.appendChild(card(d))});
  $("count").textContent=items.length+" materials · "+cur.title+" › "+sub.title;
  $("empty").hidden=res.length>0;
  $("grid").hidden=res.length===0;
  $("clear").hidden=!state.q;
  setHash();
}

function card(d){
  var t=TYPEINFO[d[1]];
  var a=document.createElement("a");a.className="card";a.href=BASE+d[5];a.target="_blank";a.rel="noopener";
  a.style.setProperty("--c",t.c);a.style.setProperty("--c2",t.c2);
  var th=document.createElement("div");th.className="thumb";th.textContent=t.icon;
  var b=document.createElement("div");b.className="body";
  var h=document.createElement("h3");h.textContent=d[0];
  var m=document.createElement("div");m.className="meta";
