<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Calendario de estudio 2027</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,500;6..72,600&display=swap" rel="stylesheet">
<style>
/* Layout: cabecera con totales, pestañas, calendario mensual en 6 columnas (lun–sáb) con días desplegables */
:root{
  --bg:#f4f2ee; --surface:#fffefb; --ink:#1d2433; --muted:#667085; --line:#e1ddd4;
  --accent:#1f4e79; --accent-ink:#ffffff; --good:#2e7d4f; --bad:#b3372d;
  --g:#2f6db5; --e:#2e8b57; --c:#c7791c; --t:#7a4fc2; --r:#7b8494;
  --disp:"Newsreader",Georgia,serif; --body:"Figtree",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12161e; --surface:#1a2030; --ink:#e8ebf2; --muted:#9aa4b8; --line:#2b3347;
  --accent:#7fb1e6; --accent-ink:#0f1a2a; --good:#5cc08a; --bad:#f08178;
  --g:#6aa5ec; --e:#5cc08a; --c:#e9a24e; --t:#b18df0; --r:#98a2b5; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#12161e; --surface:#1a2030; --ink:#e8ebf2; --muted:#9aa4b8; --line:#2b3347;
  --accent:#7fb1e6; --accent-ink:#0f1a2a; --good:#5cc08a; --bad:#f08178;
  --g:#6aa5ec; --e:#5cc08a; --c:#e9a24e; --t:#b18df0; --r:#98a2b5; color-scheme:dark;}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--body);padding:0 16px 48px}
.wrap{max-width:1280px;margin:0 auto}
h1,h2,h3{font-family:var(--disp);font-weight:600;margin:0;text-wrap:balance}
header{padding:22px 0 8px;display:flex;flex-wrap:wrap;gap:12px 24px;align-items:flex-end;justify-content:space-between}
h1{font-size:30px;letter-spacing:-.01em}
.sub{color:var(--muted);margin-top:2px}
.sync{font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:99px;padding:3px 10px;background:var(--surface)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;margin:10px 0 14px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 14px}
.tile .k{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.tile .v{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums}
.tile .v small{font-size:14px;color:var(--muted);font-weight:500}
.bar{height:6px;background:var(--line);border-radius:9px;overflow:hidden;margin-top:6px}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:9px}
.bar.good>i{background:var(--good)}
nav.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:14px;overflow-x:auto}
nav.tabs button{background:none;border:0;border-bottom:3px solid transparent;color:var(--muted);font:600 15px var(--body);padding:10px 14px;cursor:pointer;white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.months{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px;align-items:center}
.pill{background:var(--surface);border:1px solid var(--line);color:var(--ink);border-radius:99px;padding:6px 14px;font:600 14px var(--body);cursor:pointer}
.pill[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--muted);margin:0 0 10px}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;background:var(--k)}
.weekhead{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;margin:18px 0 8px}
.weekhead h3{font-size:19px}
.weekhead .meta{color:var(--muted);font-size:13px}
.weekhead .sp{flex:1}
.linkbtn{background:none;border:1px solid var(--line);border-radius:7px;color:var(--accent);font:600 13px var(--body);padding:4px 10px;cursor:pointer}
.grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px;align-items:start}
.empty{min-height:20px}
details.day{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
details.day[open]{box-shadow:0 2px 10px rgba(20,30,50,.12)}
details.day.done{border-color:var(--good);background:color-mix(in srgb,var(--good) 8%,var(--surface))}
details.day.today{outline:2px solid var(--accent)}
details.day.hol{background:color-mix(in srgb,var(--bad) 8%,var(--surface))}
details.day>summary{list-style:none;cursor:pointer;padding:8px 10px;display:grid;grid-template-columns:auto 1fr auto;gap:2px 8px;align-items:center}
details.day>summary::-webkit-details-marker{display:none}
.dn{font-size:22px;font-weight:700;font-family:var(--disp);line-height:1}
.dw{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.cnt{font-size:13px;font-weight:700;font-variant-numeric:tabular-nums}
.chev{grid-column:3;grid-row:1;color:var(--muted);transition:transform .15s}
details[open] .chev{transform:rotate(180deg)}
.sline{grid-column:1/-1;display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--muted)}
.chip{border:1px solid var(--line);border-radius:99px;padding:0 7px;font-variant-numeric:tabular-nums}
.chip.ok{color:var(--good);border-color:var(--good)}
.hbody{padding:6px 10px 10px;color:var(--bad);font-style:italic}
.blocks{padding:0 8px 8px;display:flex;flex-direction:column;gap:5px}
.blk{display:grid;grid-template-columns:1fr auto;gap:2px 8px;align-items:center;padding:6px 8px;border-radius:8px;border-left:4px solid var(--k);background:color-mix(in srgb,var(--k) 11%,var(--surface))}
.blk .hr{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;grid-column:1/-1}
.blk .tx{font-size:13.5px}
.blk.on .tx{text-decoration:line-through;color:var(--muted)}
.x{appearance:none;-webkit-appearance:none;width:26px;height:26px;border:2px solid var(--muted);border-radius:6px;background:var(--surface);cursor:pointer;display:grid;place-items:center;margin:0}
.x:checked{border-color:var(--good);background:var(--good)}
.x:checked::after{content:"✕";color:#fff;font-weight:700;font-size:15px;line-height:1}
.dfoot{display:flex;flex-wrap:wrap;gap:6px;padding:0 8px 10px}
.dfoot button{flex:1 1 auto}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:14px}
.card h2{font-size:20px;margin-bottom:8px}
form.row{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
label.f{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted);font-weight:600}
input,select,textarea{font:15px var(--body);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 9px;min-width:0}
input[type=number]{width:96px}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:8px;font:600 15px var(--body);padding:9px 16px;cursor:pointer}
.btn.sec{background:none;color:var(--accent);border:1px solid var(--line)}
.tblwrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);white-space:nowrap}
td.n,th.n{text-align:right}
tr.cur td{background:color-mix(in srgb,var(--accent) 10%,transparent)}
td input.t{width:100%;min-width:140px}
.heat{display:inline-block;min-width:46px;text-align:center;border-radius:6px;padding:1px 6px;font-weight:700}
.sm{font-size:12px;color:var(--muted)}
.rd{display:flex;flex-direction:column;align-items:center;gap:2px}
.msg{color:var(--bad);font-size:13px;min-height:18px;margin-top:6px}
.plan p,.plan li{max-width:75ch}
.plan ul{padding-left:20px}
textarea{width:100%;min-height:90px}
.ghost{background:none;border:0;color:var(--bad);cursor:pointer;font:600 13px var(--body)}
@media (max-width:1050px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:640px){.grid{grid-template-columns:1fr}.empty{display:none}h1{font-size:25px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
